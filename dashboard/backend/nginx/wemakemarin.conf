# ================================
# NGINX Configuration for Marin Pest Control Dashboard
# Last Updated: 2025-10-07
# ================================
# 
# This configuration handles:
# - Main dashboard (wemakemarin.com)
# - API backend (api.wemakemarin.com)
# - QuickBooks webhooks (webhook.wemakemarin.com)
# - Admin panel (admin.wemakemarin.com)
#
# Installation:
# sudo cp /opt/dashboard/backend/nginx/wemakemarin.conf /etc/nginx/sites-available/
# sudo ln -sf /etc/nginx/sites-available/wemakemarin.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# SSL Certificates (run after initial setup):
# sudo certbot --nginx -d wemakemarin.com -d api.wemakemarin.com -d webhook.wemakemarin.com -d admin.wemakemarin.com
# ================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/m;

# Upstream backend server
upstream backend_api {
    server localhost:5000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# Upstream frontend server (for development, use static files in production)
upstream frontend_dev {
    server localhost:3000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# ================================
# Main Dashboard (wemakemarin.com)
# ================================
server {
    listen 80;
    listen [::]:80;
    server_name wemakemarin.com www.wemakemarin.com;

    # Redirect to HTTPS (will be configured by Certbot)
    # Certbot will add the redirect automatically

    # Frontend - Production (static files)
    root /opt/dashboard/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Frontend static files
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Frontend assets (longer cache)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend development mode (comment out for production)
    # location / {
    #     proxy_pass http://frontend_dev;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ================================
# API Backend (api.wemakemarin.com)
# ================================
server {
    listen 80;
    listen [::]:80;
    server_name api.wemakemarin.com;

    # Redirect to HTTPS (will be configured by Certbot)

    # Client max body size (for file uploads)
    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API endpoints
    location /api {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward real IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://backend_api/health;
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # QuickBooks OAuth callback
    location /auth/quickbooks {
        proxy_pass http://backend_api/auth/quickbooks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ================================
# QuickBooks Webhooks (webhook.wemakemarin.com)
# ================================
# IMPORTANT: This subdomain must NOT be proxied through Cloudflare
# Set DNS to "DNS Only" (gray cloud) in Cloudflare
server {
    listen 80;
    listen [::]:80;
    server_name webhook.wemakemarin.com;

    # Redirect to HTTPS (will be configured by Certbot)

    # Webhook endpoint
    location /api/webhook {
        # Rate limiting (webhooks can be frequent)
        limit_req zone=webhook_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api/api/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Larger body size for webhook payloads
        client_max_body_size 5M;
        
        # Timeouts (webhooks should respond quickly)
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Health check
    location /health {
        proxy_pass http://backend_api/health;
        access_log off;
    }
}

# ================================
# Admin Panel (admin.wemakemarin.com)
# ================================
# Optional: Separate admin subdomain with additional security
server {
    listen 80;
    listen [::]:80;
    server_name admin.wemakemarin.com;

    # Redirect to HTTPS (will be configured by Certbot)

    # Admin panel (same frontend for now, can be separate later)
    root /opt/dashboard/frontend/dist;
    index index.html;

    # Additional security for admin panel
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://backend_api/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

